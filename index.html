<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת שליפת נתוני מניות</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
        a { color: #1a73e8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>שליפת נתוני מניות ל-CSV</h2>
    <input type="text" id="tickers" placeholder="הכנס טיקרים (למשל: AAPL, TSLA, MSFT)">
    <input type="date" id="startDate">
    <input type="date" id="endDate">
    <select id="frequency">
        <option value="1d">יומי (1d)</option>
        <option value="1wk">שבועי (1wk)</option>
        <option value="1mo">חודשי (1mo)</option>
    </select>
    <button onclick="fetchStockData()">הפק קובץ CSV</button>
    
    <div id="status"></div>
</div>

<script>
    async function fetchStockData() {
        // --- עדכני את הכתובת הזו לכתובת ה-Web App שלך ---
        const WEB_APP_URL = "כאן_להדביק_את_הכתובת_מהדפדפן_בצילום_המסך";

        const statusDiv = document.getElementById("status");
        const tickers = document.getElementById("tickers").value.split(",").map(t => t.trim());
        const startDate = document.getElementById("startDate").value;
        const endDate = document.getElementById("endDate").value;
        const frequency = document.getElementById("frequency").value;

        if (!tickers[0] || !startDate || !endDate) {
            statusDiv.innerText = "נא למלא את כל השדות.";
            return;
        }

        statusDiv.innerText = "שולח בקשה... נא להמתין כ-10 שניות.";

        const payload = {
            tickers: tickers,
            startDate: startDate,
            endDate: endDate,
            frequency: frequency
        };

        try {
            const response = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === "success") {
                statusDiv.innerHTML = `✅ הצלחה!<br><a href="${result.downloadUrl}" target="_blank">לחץ כאן להורדת קובץ ה-CSV</a>`;
            } else {
                statusDiv.innerText = "שגיאה: " + result.message;
            }
        } catch (error) {
            statusDiv.innerText = "שגיאה בחיבור לשרת. ודא שביצעת Deploy ל-Anyone.";
            console.error(error);
        }
    }
</script>

</body>
</html>
